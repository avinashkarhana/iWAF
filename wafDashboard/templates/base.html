<!doctype html>
<title>{% block title %}{% endblock %} - WAF Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<body style="background: #ddd url({{ url_for('static', filename='bg.jpg') }}) repeat top left;
background-image: url({{ url_for('static', filename='bg.jpg') }});">
  <nav>
    <h1>WAF Dashboard</h1>
    <ul>
      {% if g.user %}
        <li><span>{{ g.user['username'] }}</span>
        <li><a class='inline-link-3 inline-link-1' style="color: white;background-color: rgba(0, 0, 255, 0.537)!important;" href="{{ url_for('auth.logout') }}">Log Out</a>
      {% else %}
        <li><a class='inline-link-3 inline-link-1' href="{{ url_for('auth.login') }}">Log In</a>
      {% endif %}
    </ul>
  </nav>
  <section class="content">
    <header>
      {% block header %}{% endblock %}
    </header>
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </section>
</body>
